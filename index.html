<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leakbridge - AI Scanner</title>
  <script src="https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght=300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --nav-btn: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 450px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; letter-spacing: 2px; font-weight:400 }
    .header h2 { font-family: 'Montserrat', sans-serif; font-size: 0.8rem; letter-spacing: 2px; font-weight:200 }

    .settings-bar { width: 100%; background: var(--card); padding: 10px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
    .input-row { display: flex; justify-content: space-between; gap: 6px; width: 100%; }
    .input-group { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
    .settings-bar label { font-size: 0.65rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    .input-example { font-size: 0.55rem; color: #64748b; font-weight: 400; margin-bottom: 2px; }
    .settings-bar input { background: #0f172a; border: 1px solid #334155; color: white; padding: 6px 4px; border-radius: 6px; text-align: center; font-weight: 600; font-size: 0.85rem; width: 100%; outline: none; }

    #media-box { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; }
    
    #overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.96); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
    .progress-wrap { width: 70%; height: 6px; background: #334155; border-radius: 10px; margin-top: 15px; overflow: hidden; }
    #progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s; }
        
    .btn-reset { background: #ea580c; color: white; font-size: 0.85rem; grid-column: span 2; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn { padding: 14px; border-radius: 10px; border: none; font-weight: 400; cursor: pointer; transition: 0.2s; text-decoration: none; text-align: center; display: inline-block; }
    .btn-main { background: var(--accent); color: #0f172a; grid-column: span 2; font-size: 1rem; }
    .btn-sub { background: #334155; color: white; font-size: 0.6rem; }
    .btn-fallback { background: #10b981; color: #0f172a; font-size: 0.85rem; font-weight: 700; display: none; margin-top: 10px; width: 100%; }

    #log { font-size: 0.8rem; color: #94a3b8; text-align: center; margin-bottom: 5px; }
    #error-banner { display: none; width: 100%; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; font-size: 0.75rem; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; text-align: center; font-weight: 600; }
    #debug-read { display: none; font-size: 0.6rem; color: #475569; text-align: center; margin-bottom: 10px; font-family: monospace; overflow: hidden; height: 12px; }
    
    .viewer-wrap { display: none; width: 100%; margin-top: 10px; background: var(--card); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); padding: 12px; }
    #info-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; margin-bottom: 10px; padding: 0 4px; gap: 8px; }
    
    /* ZOOM CONTROL STYLING */
    .zoom-controls { display: flex; align-items: center; gap: 3px; background: #0f172a; padding: 3px 6px; border-radius: 6px; border: 1px solid #334155; }
    .zoom-btn { background: #1e293b; color: white; border: 1px solid #334155; width: 22px; height: 22px; border-radius: 4px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: 0.15s; }
    .zoom-btn:hover { background: var(--accent); color: #0f172a; }
    #zoom-level-indicator { font-size: 0.7rem; color: var(--accent); font-weight: 700; min-width: 36px; text-align: center; }

    #pdf-nav-bar { width: 100%; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    #pdf-nav-bar::-webkit-scrollbar { height: 4px; }
    #pdf-nav-bar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .nav-jump-btn { background: var(--nav-btn); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
    .nav-jump-btn.active { background: var(--accent); color: #0f172a; }

    /* VIEWPORT-CONTAINED TRACK & SECTIONS */
    #pdf-sections-track { width: 100%; height: 70vh; max-height: 600px; min-height: 380px; display: flex; flex-direction: column; gap: 10px; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; border-radius: 8px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); padding: 4px; }
    .page-section { width: 100%; height: 100%; min-height: 100%; scroll-snap-align: start; scroll-snap-stop: always; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #0f172a; overflow: auto; }
    .page-badge { position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.85); color: var(--accent); font-size: 0.65rem; font-weight: 700; padding: 4px 8px; border-radius: 4px; z-index: 10; border: 1px solid rgba(255,255,255,0.05); pointer-events: none; }
    
    /* DEFAULT FIT: CONTAIN ENTIRE PAGE WITHOUT AUTO-ZOOM */
    .page-section canvas { display: block; background: white; margin: auto; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; image-rendering: -webkit-optimize-contrast; transition: transform 0.15s ease-out; }
    .loading-placeholder { font-size: 0.8rem; color: #475569; font-weight: 400; text-transform: uppercase; letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }

    .mode-toggle-wrapper { display: flex; background: var(--card); border-radius: 10px; padding: 4px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
    .mode-btn { flex: 1; background: transparent; color: #64748b; border: none; padding: 8px; font-size: 0.75rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    .mode-btn.active { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <div class="header">
    <h1>Leakbridge Papers</h1>
    <h2>only takes code like: ON/2021/22/Q5,S23/13/Q26</h2>
  </div>
  
<div class="container">
  
  <button class="btn btn-sub" onclick="toggleMainAppView()" id="app-view-toggle" style="width: 100%; margin-bottom: 15px; font-size: 0.75rem; background: #475569;">
    SWITCH TO KEYWORD FINDER 🔍
  </button>

  <!-- KEYWORD FINDER VIEW -->
  <div id="keyword-finder-view" style="display: none;">
    <div class="mode-toggle-wrapper">
      <button class="mode-btn active" id="btn-math" onclick="switchMode('math')">📐 Math & Science</button>
      <button class="mode-btn" id="btn-hum" onclick="switchMode('hum')">📚 Humanities</button>
    </div>

    <div class="settings-bar">
      <div class="input-row">
        <div class="input-group">
          <label>Subject</label>
          <span class="input-example">e.g. 9709</span>
          <input type="text" id="kf-sub" value="9709" maxlength="4">
        </div>
        <div class="input-group">
          <label>Year</label>
          <span class="input-example">e.g. 21</span>
          <input type="text" id="kf-yr" value="21" maxlength="2">
        </div>
        <div class="input-group">
          <label>Series</label>
          <span class="input-example">e.g. s</span>
          <input type="text" id="kf-seas" value="s" maxlength="1">
        </div>
        <div class="input-group">
          <label>Paper</label>
          <span class="input-example">e.g. 12</span>
          <input type="text" id="kf-pap" value="12" maxlength="2">
        </div>
      </div>
      
      <div class="input-group" style="margin-top: 10px; width: 100%;">
        <label>Question Keywords</label>
        <input type="text" id="kf-keyword" placeholder="e.g., Find exact value of theta, given f(x) = 3e^(2x)" style="width: 100%; text-align: left; padding-left: 10px; background: #0f172a; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; font-size: 0.85rem;">
      </div>
    </div>

    <button class="btn btn-main" onclick="startKeywordSearch()" style="margin-bottom: 15px; width: 100%;">🔍 LOCATE QUESTION VIA KEYWORDS</button>
  </div>


  <!-- CAMERA SCANNER VIEW -->
  <div id="scanner-view">
    <div class="settings-bar">
      <div class="input-row">
        <div class="input-group">
          <label>Subject</label>
          <span class="input-example">e.g. 9709</span>
          <input type="text" id="sub-input" value="9709" maxlength="4">
        </div>
        <div class="input-group">
          <label>Year</label>
          <span class="input-example">e.g. 25</span>
          <input type="text" id="yr-input" value="25" maxlength="2">
        </div>
        <div class="input-group">
          <label>Series</label>
          <span class="input-example">e.g. s</span>
          <input type="text" id="seas-input" value="s" maxlength="1">
        </div>
        <div class="input-group">
          <label>Paper</label>
          <span class="input-example">e.g. 12</span>
          <input type="text" id="pap-input" value="12" maxlength="2">
        </div>
        <div class="input-group">
          <label>Target Q</label>
          <span class="input-example">e.g. 5</span>
          <input type="text" id="q-input" value="1" maxlength="2">
        </div>
      </div>
    </div>

    <div id="media-box">
      <video id="video" autoplay playsinline muted style="display:none;"></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <div id="overlay">
        <div id="status-txt" style="font-weight:700; color:var(--accent);">INITIALIZING...</div>
        <div class="progress-wrap"><div id="progress-fill"></div></div>
      </div>
    </div>

    <div id="log">Ready to Scan Paper</div>
    <div id="debug-read"></div>

    <div class="btn-grid">
      <button class="btn btn-main" onclick="doCapture()">CAPTURE & ANALYZE</button>
      <button class="btn btn-sub" onclick="runNativeRenderPipeline()">FETCH FROM TEXT BOX</button>
      <label class="btn btn-sub" style="text-align:center; cursor:pointer;">UPLOAD<input type="file" hidden accept="image/*" onchange="doUpload(event)"></label>
      <button class="btn btn-sub btn-reset" onclick="resetCameraSystem()">START/RESET CAMERA</button>
    </div>
  </div>

  <div id="error-banner"></div>
  <a id="papacambridge-fallback" class="btn btn-fallback" target="_blank" href="#">OPEN MARKING SCHEME PDF</a>

  <!-- VIEWER WRAPPER -->
  <div class="viewer-wrap" id="viewer-wrap">
    <div id="info-bar">
        <span id="paper-id" style="color:var(--accent); font-weight:bold;"></span>
        
        <!-- ZOOM CONTROL UI -->
        <div class="zoom-controls">
          <button onclick="adjustZoom(-0.15)" class="zoom-btn" title="Zoom Out">-</button>
          <span id="zoom-level-indicator">100%</span>
          <button onclick="adjustZoom(0.15)" class="zoom-btn" title="Zoom In">+</button>
          <button onclick="resetZoom()" class="zoom-btn" title="Reset Zoom">↺</button>
        </div>

        <span id="match-status" style="font-size:0.75rem; color:#94a3b8;"></span>
    </div>
    <div id="pdf-nav-bar"></div>
    <div id="pdf-sections-track"></div>
  </div>

</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
  
  const MY_WORKER_URL = "https://proxy.questionscanner.workers.dev";

  const subjectNames = {
    "9709": "mathematics", "9702": "physics", "9701": "chemistry", "9700": "biology",
    "9618": "computer-science", "9708": "economics", "9706": "accounting", "9609": "business",
    "0580": "mathematics", "0625": "physics", "0620": "chemistry", "0610": "biology",
    "0478": "computer-science", "0455": "economics", "0452": "accounting", "0985": "accounting",
    "0450": "business-studies",
    "7707": "accounting", "4024": "mathematics-d", "5054": "physics", "5070": "chemistry",
    "5090": "biology", "2210": "computer-science", "2281": "economics", "7115": "business-studies"
  };
  
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const overlay = document.getElementById('overlay');
  const prog = document.getElementById('progress-fill');
  const fallbackBtn = document.getElementById('papacambridge-fallback');
  const errorBanner = document.getElementById('error-banner');
  
  let ocrWorker = null;
  let currentPdf = null;
  let scrollObserver = null;
  let isKeywordFinderActive = false;

  // --- ZOOM CONTROL ENGINE ---
  let currentZoomScale = 1.0;

  function adjustZoom(amount) {
    currentZoomScale = Math.min(Math.max(0.8, currentZoomScale + amount), 2.5);
    applyZoom();
  }

  function resetZoom() {
    currentZoomScale = 1.0;
    applyZoom();
  }

  function applyZoom() {
    const indicator = document.getElementById('zoom-level-indicator');
    if (indicator) {
      indicator.innerText = `${Math.round(currentZoomScale * 100)}%`;
    }
    
    document.querySelectorAll('.page-section canvas').forEach(pageCanvas => {
      if (currentZoomScale === 1.0) {
        // Fit completely inside the viewport bounds without auto-zooming
        pageCanvas.style.maxWidth = '100%';
        pageCanvas.style.maxHeight = '100%';
        pageCanvas.style.width = 'auto';
        pageCanvas.style.height = 'auto';
      } else {
        // Allow scaling beyond container bounds when zoomed in
        pageCanvas.style.maxWidth = 'none';
        pageCanvas.style.maxHeight = 'none';
        pageCanvas.style.width = `${100 * currentZoomScale}%`;
        pageCanvas.style.height = 'auto';
      }
    });
  }

  function toggleMainAppView() {
    isKeywordFinderActive = !isKeywordFinderActive;
    
    if (isKeywordFinderActive) {
      document.getElementById('scanner-view').style.display = 'none';
      document.getElementById('keyword-finder-view').style.display = 'block';
      document.getElementById('app-view-toggle').innerText = "SWITCH TO CAMERA SCANNER 📷";
      stopCam();
    } else {
      document.getElementById('scanner-view').style.display = 'block';
      document.getElementById('keyword-finder-view').style.display = 'none';
      document.getElementById('app-view-toggle').innerText = "SWITCH TO KEYWORD FINDER 🔍";
    }
    
    document.getElementById('viewer-wrap').style.display = 'none';
    hideError();
  }

  function switchMode(mode) {
    const keywordInput = document.getElementById('kf-keyword');
    document.getElementById('btn-math').classList.remove('active');
    document.getElementById('btn-hum').classList.remove('active');
    document.getElementById(`btn-${mode}`).classList.add('active');

    if (mode === 'math') {
      keywordInput.placeholder = "e.g., Find exact value of theta, given f(x) = 3e^(2x)";
    } else {
      keywordInput.placeholder = "e.g., Using Fig. 1.1, explain the impact of inflation";
    }
  }

  // --- KEYWORD FINDER ENGINE & HAND-OFF ---
  async function startKeywordSearch() {
    hideError();

    const sub = document.getElementById('kf-sub').value.trim();
    const yr = document.getElementById('kf-yr').value.trim();
    const seas = document.getElementById('kf-seas').value.trim().toLowerCase();
    const pap = document.getElementById('kf-pap').value.trim();
    const keyword = document.getElementById('kf-keyword').value.trim();

    if (!/^\d{4}$/.test(sub)) return showError("Subject must be 4 numeric digits (e.g. 9709).");
    if (!/^\d{2}$/.test(yr)) return showError("Year must be 2 numeric digits (e.g. 21).");
    if (!/^[swm]$/i.test(seas)) return showError("Series must be 's', 'w', or 'm'.");
    if (!/^\d{2}$/.test(pap)) return showError("Paper must be 2 numeric digits (e.g. 12).");
    if (keyword.length < 3) return showError("Please enter at least 3 distinct letters or numbers.");

    overlay.style.display = 'flex';
    updateProg(15, "Fetching Question Paper (QP)...");

    try {
      let levelFolder = "cambridge-international-a-level";
      if (sub.startsWith('0') || sub === '0985') levelFolder = "cambridge-igcse"; 
      else if (/^[2457]/.test(sub)) levelFolder = "cambridge-o-level";
      
      const folderName = subjectNames[sub] || "subject";
      const fullYear = `20${yr}`;
      const qpUrl = `https://bestexamhelp.com/exam/${levelFolder}/${folderName}-${sub}/${fullYear}/${sub}_${seas}${yr}_qp_${pap}.pdf`;

      updateProg(35, "Downloading QP Document...");
      const qpPdf = await fetchPDFResilient(qpUrl);

      updateProg(60, "Scanning Pages for Keywords...");
      
      const cleanKeywords = keyword.toUpperCase().replace(/[^\w\s]/gi, '').split(/\s+/).filter(w => w.length > 2);
      let highestMatchCount = 0;
      let detectedQuestionNum = null;

      for (let i = 1; i <= qpPdf.numPages; i++) {
        const page = await qpPdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items
          .filter(item => item && typeof item.str === 'string')
          .map(item => item.str)
          .join(' ')
          .toUpperCase();

        let matches = 0;
        cleanKeywords.forEach(kw => { if (pageText.includes(kw)) matches++; });

        if (matches > highestMatchCount) {
          highestMatchCount = matches;
          const qNumberMatch = pageText.match(/(?:QUESTION|\bQ)?\s*([1-9][0-9]?)\s*[\(\[\.\s]/);
          if (qNumberMatch) detectedQuestionNum = qNumberMatch[1];
        }
      }

      if (!detectedQuestionNum) detectedQuestionNum = "1";

      updateProg(90, `MATCH FOUND! (Question ${detectedQuestionNum})`);

      document.getElementById('sub-input').value = sub;
      document.getElementById('yr-input').value = yr;
      document.getElementById('seas-input').value = seas;
      document.getElementById('pap-input').value = pap;
      document.getElementById('q-input').value = detectedQuestionNum;

      setTimeout(() => {
        isKeywordFinderActive = false;
        document.getElementById('keyword-finder-view').style.display = 'none';
        document.getElementById('scanner-view').style.display = 'block';
        document.getElementById('app-view-toggle').innerText = "SWITCH TO KEYWORD FINDER 🔍";
        document.getElementById('match-status').innerText = `✨ Auto-matched Q${detectedQuestionNum}`;
        runNativeRenderPipeline();
      }, 500);

    } catch (err) {
      console.error("Keyword Search Error:", err);
      overlay.style.display = 'none';
      showError("Could not locate question from provided keywords.");
    }
  }

  function showError(msg) {
    errorBanner.innerText = msg;
    errorBanner.style.display = 'block';
  }

  function hideError() {
    errorBanner.innerText = '';
    errorBanner.style.display = 'none';
  }

  async function setupOCR() {
    if (!ocrWorker) {
      ocrWorker = await Tesseract.createWorker();
      await ocrWorker.loadLanguage('eng');
      await ocrWorker.initialize('eng');
    }
  }
  setupOCR();

  let cameraStream = null;

  async function initCam() {
    try {
      if (cameraStream) stopCam();
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
      video.srcObject = cameraStream;
      video.style.display = 'block'; 
      canvas.style.display = 'none';
      document.getElementById('log').innerText = "scanner active";
    } catch(e) { 
      document.getElementById('log').innerText = "Camera stream blocked or unavailable."; 
    }
  }

  function stopCam() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.srcObject = null;
  }

  function resetCameraSystem() {
    stopCam();
    document.getElementById('viewer-wrap').style.display = 'none';
    fallbackBtn.style.display = 'none';
    canvas.style.display = 'none';
    hideError();
    document.getElementById('debug-read').innerText = "";
    initCam();
  }

  function processImage() {
    if (!cameraStream) {
      showError("Camera feed is offline. Tap 'RESET / START CAMERA' first.");
      return;
    }
    const ctx = canvas.getContext('2d');
    const scale = video.videoWidth > 1200 ? 1200 / video.videoWidth : 1;
    canvas.width = video.videoWidth * scale;
    canvas.height = video.videoHeight * scale;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    stopCam();
    video.style.display = 'none'; 
    canvas.style.display = 'block';
    processPipeline();
  }

  function doCapture() {
    if(video.style.display === 'none' || video.videoWidth === 0) {
      showError("Camera track is offline. Tap 'RESET / START CAMERA' first.");
      return;
    }
    processImage();
  }

  function doUpload(e) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width; canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        stopCam();
        video.style.display = 'none'; 
        canvas.style.display = 'block';
        processPipeline();
      };
      img.src = ev.target.result;
    };
    if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
  }

  async function processPipeline() {
    hideError();
    overlay.style.display = 'flex';
    updateProg(15, "Analyzing Document Geometry...");

    try {
      await setupOCR();
      updateProg(40, "Extracting Core Identifiers...");
      const { data: { text } } = await ocrWorker.recognize(canvas);
      
      const rawText = text.toUpperCase();
      document.getElementById('debug-read').innerText = "OCR String: " + rawText.replace(/\n/g, ' ').substring(0, 45);

      const cleanStr = rawText.replace(/\s+/g, '').replace(/0N/g, 'ON');
      const officialRegex = /(\d{4})\/(\d{1,2})\/(ON|MJ|FM|O\/N|M\/J|F\/M|S|W|M)\/(\d{2})/i;
      const exactMatch = cleanStr.match(officialRegex);

      if (exactMatch) {
        document.getElementById('sub-input').value = exactMatch[1];
        document.getElementById('pap-input').value = exactMatch[2];
        const s = exactMatch[3].replace(/\//g, '').toUpperCase();
        if (s === 'ON' || s === 'W') document.getElementById('seas-input').value = 'w';
        else if (s === 'FM' || s === 'M') document.getElementById('seas-input').value = 'm';
        else document.getElementById('seas-input').value = 's';
        document.getElementById('yr-input').value = exactMatch[4];

        const qMatch = rawText.match(/Q(?:UESTION)?\s*[-/.:]?\s*(\d{1,2})\b/);
        if (qMatch) document.getElementById('q-input').value = qMatch[1];
      } else {
        let cleanText = rawText.replace(/0N/g, 'ON').replace(/5(?=[0-3]\d)/g, 'S'); 

        const subMatch = cleanText.match(/\b(\d{4})\b/);
        if (subMatch && !subMatch[1].startsWith('20')) document.getElementById('sub-input').value = subMatch[1];

        const seasMatch = cleanText.match(/(ON|MJ|FM|O\/N|M\/J|F\/M|S|W|M)/);
        if (seasMatch) {
          const s = seasMatch[1].replace(/\//g, '');
          if (s === 'ON' || s === 'W') document.getElementById('seas-input').value = 'w';
          else if (s === 'FM' || s === 'M') document.getElementById('seas-input').value = 'm';
          else document.getElementById('seas-input').value = 's';
        }

        let yearMatch = cleanText.match(/20([0-3]\d)/);
        let matchedYearString = "";
        
        if (yearMatch) {
          document.getElementById('yr-input').value = yearMatch[1];
          matchedYearString = yearMatch[0];
        } else {
          const shortYearMatch = cleanText.match(/(?:S|W|M|ON|MJ|FM)[^\d]*([0-3]\d)\b/);
          if (shortYearMatch) {
            document.getElementById('yr-input').value = shortYearMatch[1];
            matchedYearString = shortYearMatch[0];
          }
        }

        let remainingText = cleanText;
        if (matchedYearString) remainingText = remainingText.replace(matchedYearString, ' ');

        const qMatch = remainingText.match(/Q(?:UESTION)?\s*[-/.:]?\s*(\d{1,2})\b/);
        if (qMatch) {
          document.getElementById('q-input').value = qMatch[1];
          remainingText = remainingText.replace(qMatch[0], ' ');
        }

        const papMatch = remainingText.match(/\b([1-6][0-9]?|[1-9])\b/);
        if (papMatch) document.getElementById('pap-input').value = papMatch[1];
      }

    } catch(err) {
      console.warn("OCR non-blocking bypass active or error occurred.", err);
    }
    
    await runNativeRenderPipeline();
  }
  
  async function fetchPDFResilient(targetUrl) {
    const proxyUrl = `${MY_WORKER_URL}?url=${encodeURIComponent(targetUrl.trim())}`;
    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
    
    const buffer = await response.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    
    if (bytes.length < 5 || bytes[0] !== 0x25 || bytes[1] !== 0x50 || bytes[2] !== 0x44 || bytes[3] !== 0x46) {
       throw new Error("Target site returned HTML or non-PDF data (404 page).");
    }

    const task = pdfjsLib.getDocument({ data: bytes });
    return await task.promise;
  }

  async function runNativeRenderPipeline() {
    hideError();
    resetZoom(); 

    const sub = document.getElementById('sub-input').value.trim();
    const yr = document.getElementById('yr-input').value.trim();
    const seas = document.getElementById('seas-input').value.trim().toLowerCase();
    const pap = document.getElementById('pap-input').value.trim();
    const targetQ = document.getElementById('q-input').value.trim() || "1";

    overlay.style.display = 'flex';
    document.getElementById('viewer-wrap').style.display = 'none';
    fallbackBtn.style.display = 'none';
    document.getElementById('paper-id').innerText = `${sub} | ${seas.toUpperCase()}${yr} | P${pap} | Q${targetQ}`;
    
    const navBar = document.getElementById('pdf-nav-bar');
    const track = document.getElementById('pdf-sections-track');
    
    navBar.innerHTML = '';
    track.innerHTML = ''; 
    if(scrollObserver) scrollObserver.disconnect();

    const loadingPhrases = ["leaking the paper...", "giving the paper to redditors...", "ruining careers..."];
    let phraseIndex = 0;
    updateProg(50, loadingPhrases[phraseIndex]);

    const loadingInterval = setInterval(() => {
      if (document.getElementById('overlay').style.display !== 'none') {
        phraseIndex = (phraseIndex + 1) % loadingPhrases.length;
        document.getElementById('status-txt').innerText = loadingPhrases[phraseIndex];
      } else {
        clearInterval(loadingInterval);
      }
    }, 10000);
    
    currentPdf = null; 
    let levelFolder = "cambridge-international-a-level";
    if (sub.startsWith('0') || sub === '0985') levelFolder = "cambridge-igcse"; 
    else if (/^[2457]/.test(sub)) levelFolder = "cambridge-o-level";
    const folderName = subjectNames[sub] || "subject";
    const fullYear = `20${yr}`;
    const msUrl = `https://bestexamhelp.com/exam/${levelFolder}/${folderName}-${sub}/${fullYear}/${sub}_${seas}${yr}_ms_${pap}.pdf`;

    try {
      currentPdf = await fetchPDFResilient(msUrl);
    } catch (e) {
      clearInterval(loadingInterval);
      overlay.style.display = 'none';
      
      let pcLevel = "as-and-a-level";
      if (sub.startsWith('0') || sub === '0985') pcLevel = "igcse";
      else if (/^[2457]/.test(sub)) pcLevel = "o-level";
      const monthMap = { 's': 'jun', 'w': 'nov', 'm': 'mar' };
      const monthStr = monthMap[seas.toLowerCase()] || 'jun';
      let cleanPap = (parseInt(yr, 10) < 10 && pap.length === 2) ? pap.charAt(1) : parseInt(pap, 10).toString();
      
      fallbackBtn.href = `https://pastpapers.papacambridge.com/viewer/caie/${pcLevel}-${folderName}-${sub}-${fullYear}-${monthStr}-${sub}-${seas.toLowerCase()}${yr}-ms-${cleanPap}-pdf`;
      fallbackBtn.style.display = 'block';
      showError("Could not fetch document automatically. Direct link generated below.");
      return;
    }

    document.getElementById('viewer-wrap').style.display = 'block';

    try {
      let matchedPage = null; 
      let fallbackPage = 2; 
      let foundMatch = false;

      for (let i = 1; i <= currentPdf.numPages; i++) {
        if (foundMatch) break;
        const page = await currentPdf.getPage(i);
        const content = await page.getTextContent();
        const fullPageText = content.items.filter(item => item && typeof item.str === 'string').map(item => item.str).join(' ').toUpperCase(); 
        
        if (fullPageText.includes("ANNOTATION") || fullPageText.includes("SPECIFIC MARKING INSTRUCTIONS") || (fullPageText.includes("GENERIC MARKING") && i <= 3)) continue; 

        const leftColumnList = content.items.filter(item => {
          if (!item || typeof item.str !== 'string') return false;
          return (item.transform ? item.transform[4] : 0) >= 20 && (item.transform ? item.transform[4] : 0) < 95;
        });

        for (let item of leftColumnList) {
          const rawStr = item.str.trim();
          if (!rawStr || /PAGE|MARK|TOTAL|SUBJECT/i.test(rawStr)) continue;
          if (new RegExp('^1(?!\\d)', 'i').test(rawStr)) if(fallbackPage === 2) fallbackPage = i; 
          
          if (new RegExp('^0?' + targetQ + '(?!\\d)', 'i').test(rawStr)) {
            matchedPage = i; foundMatch = true; break;
          }
        }
      }

      matchedPage = foundMatch ? matchedPage : (fallbackPage <= currentPdf.numPages ? fallbackPage : 1);
      document.getElementById('match-status').innerText = foundMatch ? `Focused Page ${matchedPage}` : `Target Q Not Found - Pg ${matchedPage}`;

      scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageNum = parseInt(entry.target.dataset.page);
            executeLazyRender(pageNum);
            updateActiveNavHighlight(pageNum);
          }
        });
      }, { root: track, threshold: 0.1, rootMargin: "50px 0px" });

      for (let i = 1; i <= currentPdf.numPages; i++) {
        const navBtn = document.createElement('button');
        navBtn.className = 'nav-jump-btn' + (i === matchedPage ? ' active' : '');
        navBtn.id = `nav-btn-${i}`;
        navBtn.innerText = `Pg ${i}`;
        navBtn.onclick = () => jumpToSection(i);
        navBar.appendChild(navBtn);

        const section = document.createElement('div');
        section.id = `page-sec-${i}`; section.className = 'page-section'; section.dataset.page = i;
        section.innerHTML = `<div class="page-badge">PAGE ${i}</div><span class="loading-placeholder" id="loader-txt-${i}">Scroll to View</span>`;
        track.appendChild(section); scrollObserver.observe(section);
      }

      updateProg(100, "Sync Complete.");
      setTimeout(() => { overlay.style.display = 'none'; jumpToSection(matchedPage); }, 150);

    } catch (err) {
      document.getElementById('match-status').innerText = "Analysis Failed";
      overlay.style.display = 'none';
    }
  }

  // --- ASPECT FIT LAZY RENDER ENGINE ---
  async function executeLazyRender(pageNum) {
    if (!currentPdf) return;
    try {
      const section = document.getElementById(`page-sec-${pageNum}`);
      if (!section || section.dataset.rendering === "true") return;
      section.dataset.rendering = "true";

      let pageCanvas = section.querySelector('canvas');
      if (!pageCanvas) {
        pageCanvas = document.createElement('canvas');
        section.appendChild(pageCanvas);
      } else {
        section.dataset.rendering = "false";
        return; 
      }

      const page = await currentPdf.getPage(pageNum);
      
      const containerWidth = section.clientWidth || window.innerWidth;
      const containerHeight = section.clientHeight || window.innerHeight;
      const unscaledViewport = page.getViewport({ scale: 1.0 });

      // Calculate scale to fit bounded area completely without zooming in past edges
      const scaleX = containerWidth / unscaledViewport.width;
      const scaleY = containerHeight / unscaledViewport.height;
      const fitScale = Math.min(scaleX, scaleY);
      
      const renderPixelRatio = (window.devicePixelRatio || 1) * 1.5; 
      const viewport = page.getViewport({ scale: fitScale * renderPixelRatio });

      pageCanvas.width = viewport.width;
      pageCanvas.height = viewport.height;
      
      applyZoom(); // Sync current zoom boundaries to new canvas

      const ctx = pageCanvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      
      const placeholder = document.getElementById(`loader-txt-${pageNum}`);
      if (placeholder) placeholder.remove();
      section.dataset.rendering = "false";
    } catch (e) {
      console.error(`Dynamic viewport error on page ${pageNum}:`, e);
    }
  }

  function jumpToSection(pageNum) {
    const section = document.getElementById(`page-sec-${pageNum}`);
    if (section) {
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function updateActiveNavHighlight(pageIndex) {
    document.querySelectorAll('.nav-jump-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.getElementById(`nav-btn-${pageIndex}`);
    if(activeBtn) {
      activeBtn.classList.add('active');
      activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  function updateProg(pct, msg) {
    prog.style.width = pct + "%"; document.getElementById('status-txt').innerText = msg;
  }
</script>
