<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
  
  // ==========================================
  // UPDATED SOURCES (PastPapers.co REMOVED)
  // ==========================================
  const paperSources = [
    {
      name: "BestExamHelp",
      buildUrl: (sub, yr, seas, pap) => {
        const subjectNames = {
          "9709": "mathematics", "9702": "physics", "9701": "chemistry", "9700": "biology",
          "9618": "computer-science", "9708": "economics", "9706": "accounting", "9609": "business",
          "0580": "mathematics", "0625": "physics", "0620": "chemistry", "0610": "biology",
          "0478": "computer-science", "0455": "economics", "0452": "accounting", "0985": "accounting",
          "0450": "business-studies",
          "7707": "accounting", "4024": "mathematics-d", "5054": "physics", "5070": "chemistry",
          "5090": "biology", "2210": "computer-science", "2281": "economics", "7115": "business-studies"
        };
        
        let levelFolder = "cambridge-international-a-level";
        if (sub.startsWith('0') || sub === '0985') { levelFolder = "cambridge-igcse"; } 
        else if (/^[2457]/.test(sub)) { levelFolder = "cambridge-o-level"; }
        
        const folderName = subjectNames[sub] || "subject";
        const fullYear = `20${yr}`;
        
        return `https://bestexamhelp.com/exam/${levelFolder}/${folderName}-${sub}/${fullYear}/${sub}_${seas}${yr}_ms_${pap}.pdf`;
      }
    },
    {
      name: "GCE Guide",
      buildUrl: (sub, yr, seas, pap) => {
        const subjectNames = {
          "9709": "Mathematics", "9702": "Physics", "9701": "Chemistry", "9700": "Biology",
          "9618": "Computer Science", "9708": "Economics", "9706": "Accounting", "9609": "Business",
          "0580": "Mathematics", "0625": "Physics", "0620": "Chemistry", "0610": "Biology",
          "0478": "Computer Science", "0455": "Economics", "0452": "Accounting", "0985": "Accounting",
          "0450": "Business Studies",
          "7707": "Accounting", "4024": "Mathematics D (Calculator Version)", "5054": "Physics", "5070": "Chemistry",
          "5090": "Biology", "2210": "Computer Science", "2281": "Economics", "7115": "Business Studies"
        };
        
        let levelFolder = "A%20Levels";
        if (sub.startsWith('0') || sub === '0985') { levelFolder = "IGCSE"; } 
        else if (/^[2457]/.test(sub)) { levelFolder = "O%20Levels"; }
        
        const folderName = subjectNames[sub] ? encodeURIComponent(subjectNames[sub]) : "Subject";
        const fullYear = `20${yr}`;
        
        return `https://papers.gceguide.cc/${levelFolder}/${folderName}%20(${sub})/${fullYear}/${sub}_${seas}${yr}_ms_${pap}.pdf`;
      }
    }
  ];
  
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const overlay = document.getElementById('overlay');
  const prog = document.getElementById('progress-fill');
  
  let ocrWorker = null;
  let currentPdf = null;
  let scrollObserver = null;

  async function setupOCR() {
    if (!ocrWorker) {
      ocrWorker = await Tesseract.createWorker();
      await ocrWorker.loadLanguage('eng');
      await ocrWorker.initialize('eng');
    }
  }
  setupOCR();

  let cameraStream = null;

  async function initCam() {
    try {
      if (cameraStream) stopCam();
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
      video.srcObject = cameraStream;
      video.style.display = 'block'; 
      canvas.style.display = 'none';
      document.getElementById('log').innerText = "scanner active";
    } catch(e) { 
      document.getElementById('log').innerText = "Camera stream blocked or unavailable."; 
    }
  }

  function stopCam() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.srcObject = null;
  }

  function resetCameraSystem() {
    stopCam();
    document.getElementById('viewer-wrap').style.display = 'none';
    canvas.style.display = 'none';
    document.getElementById('debug-read').innerText = "";
    initCam();
  }

  function processImage() {
    if (!cameraStream) return alert("Camera feed is offline. Tap 'RESET / START CAMERA' first.");
    const ctx = canvas.getContext('2d');
    const scale = video.videoWidth > 1200 ? 1200 / video.videoWidth : 1;
    canvas.width = video.videoWidth * scale;
    canvas.height = video.videoHeight * scale;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    stopCam();
    
    video.style.display = 'none'; 
    canvas.style.display = 'block';
    processPipeline();
  }

  function doCapture() {
    if(video.style.display === 'none' || video.videoWidth === 0) {
      return alert("Camera track is offline. Tap 'RESET / START CAMERA' first.");
    }
    processImage();
  }

  function doUpload(e) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width; canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        
        stopCam();
        
        video.style.display = 'none'; 
        canvas.style.display = 'block';
        processPipeline();
      };
      img.src = ev.target.result;
    };
    if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
  }

  async function processPipeline() {
    overlay.style.display = 'flex';
    updateProg(15, "Analyzing Document Geometry...");

    try {
      await setupOCR();
      updateProg(40, "Extracting Core Identifiers...");
      const { data: { text } } = await ocrWorker.recognize(canvas);
      
      const clean = text.toUpperCase().replace(/\s+/g, '');
      document.getElementById('debug-read').innerText = "OCR String: " + clean.substring(0, 35);

      const regex = /([FMSW]|MJ|ON|FM)(?:\/)?(\d{4}|\d{2})[\/|I1\s-]?(\d{1,2})(?:[\/|I1\s-]?Q(\d+))?/i;
      const match = clean.match(regex);

      if (match) {
        let rawSession = match[1];
        let computedSeas = "s";
        if (rawSession === "MJ" || rawSession === "J" || rawSession === "S") computedSeas = "s";
        else if (rawSession === "ON" || rawSession === "W") computedSeas = "w";
        else if (rawSession === "FM" || rawSession === "M" || rawSession === "F") computedSeas = "m";
        else computedSeas = rawSession.toLowerCase();

        let rawYear = match[2];
        let computedYr = rawYear.length === 4 ? rawYear.substring(2) : rawYear;
        let computedPap = match[3];
        
        document.getElementById('yr-input').value = computedYr;
        document.getElementById('seas-input').value = computedSeas;
        document.getElementById('pap-input').value = computedPap;
        
        if (match[4]) {
          const qInput = document.getElementById('q-input');
          qInput.value = ""; 
          qInput.value = match[4].trim();
        }
      }
    } catch(err) {
      console.warn("OCR non-blocking bypass active.");
    }
    
    await runNativeRenderPipeline();
  }

  async function fetchPDFResilient(targetUrl) {
    console.log("🎯 TARGET URL:", targetUrl);
    
    // Custom Cloudflare Worker Proxy
    const MY_WORKER_URL = "https://proxy.questionscanner.workers.dev";
    const proxyUrl = `${MY_WORKER_URL}?url=${encodeURIComponent(targetUrl.trim())}`;

    try {
      console.log("⏳ Requesting file through custom Cloudflare Worker...");
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
      
      const buffer = await response.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      
      // Magic Bytes Check (%PDF)
      if (bytes.length < 5 || bytes[0] !== 0x25 || bytes[1] !== 0x50 || bytes[2] !== 0x44 || bytes[3] !== 0x46) {
         throw new Error("Target site returned HTML or non-PDF data (404 page).");
      }

      const task = pdfjsLib.getDocument({ data: bytes });
      const pdf = await task.promise;
      console.log("✅ PDF fetched and parsed successfully.");
      return pdf;
    } catch (e) {
      console.error("❌ Proxy request failed:", e.message);
      throw e;
    }
  }

  async function runNativeRenderPipeline() {
    const sub = document.getElementById('sub-input').value.trim();
    const yr = document.getElementById('yr-input').value.trim();
    const seas = document.getElementById('seas-input').value.trim().toLowerCase();
    const pap = document.getElementById('pap-input').value.trim();
    const targetQ = document.getElementById('q-input').value.trim() || "1";

    if (!/^\d{4}$/.test(sub)) {
      alert("Validation Error:\nSubject must be exactly 4 numeric digits (e.g., 0580 or 9702).");
      return;
    }
    if (!/^\d{2}$/.test(yr)) {
      alert("Validation Error:\nYear must be exactly 2 numeric digits (e.g., 25).");
      return;
    }
    if (!/^[swm]$/i.test(seas)) {
      alert("Validation Error:\nSeries must be a single letter: 's' (Summer), 'w' (Winter), or 'm' (March).");
      return;
    }
    if (!/^\d{2}$/.test(pap)) {
      alert("Validation Error:\nPaper must be exactly 2 numeric digits (e.g., 12).");
      return;
    }
    if (!/^\d{1,2}$/.test(targetQ) || parseInt(targetQ, 10) <= 0) {
      alert("Validation Error:\nTarget Question must be a positive integer value between 1 and 99.");
      return;
    }

    overlay.style.display = 'flex';
    document.getElementById('viewer-wrap').style.display = 'block';
    document.getElementById('paper-id').innerText = `${sub} | ${seas.toUpperCase()}${yr} | P${pap} | Q${targetQ}`;
    
    const navBar = document.getElementById('pdf-nav-bar');
    const track = document.getElementById('pdf-sections-track');
    
    navBar.innerHTML = '';
    track.innerHTML = ''; 
    if(scrollObserver) scrollObserver.disconnect();

    const loadingPhrases = [
      "leaking the paper...",
      "giving the paper to redditors...",
      "ruining careers ..."
    ];
    let phraseIndex = 0;
    
    updateProg(50, loadingPhrases[phraseIndex]);

    const loadingInterval = setInterval(() => {
      if (document.getElementById('overlay').style.display !== 'none') {
        phraseIndex = (phraseIndex + 1) % loadingPhrases.length;
        document.getElementById('status-txt').innerText = loadingPhrases[phraseIndex];
      } else {
        clearInterval(loadingInterval);
      }
    }, 10000);
    
    currentPdf = null; 

    for (let i = 0; i < paperSources.length; i++) {
      const source = paperSources[i];
      const generatedUrl = source.buildUrl(sub, yr, seas, pap);
      updateProg(55 + (i * 10), `Trying ${source.name}...`);
      
      try {
        currentPdf = await fetchPDFResilient(generatedUrl);
        break; 
      } catch (e) {
        console.warn(`Fallback: ${source.name} failed.`);
      }
    }

    if (!currentPdf) {
      clearInterval(loadingInterval);
      document.getElementById('match-status').innerText = "Load Failed";
      alert(`Could not find document anywhere.\n\nOpen F12 Console to see exactly why it failed.`);
      overlay.style.display = 'none';
      return;
    }

    try {
      let matchedPage = null; 
      let fallbackPage = 2; // Smart default: skips the useless cover page
      let foundMatch = false;

      for (let i = 1; i <= currentPdf.numPages; i++) {
        if (foundMatch) break;
        const page = await currentPdf.getPage(i);
        const content = await page.getTextContent();
        
        const fullPageText = content.items
          .filter(item => item && typeof item.str === 'string')
          .map(item => item.str)
          .join(' ')
          .toUpperCase(); 
        
        // Rapidly skip generic instructions pages 
        if (fullPageText.includes("ANNOTATION") || 
            fullPageText.includes("SPECIFIC MARKING INSTRUCTIONS") ||
            (fullPageText.includes("GENERIC MARKING") && i <= 3)) {
          continue; 
        }

        // TIGHTER LEFT MARGIN BOUNDARY (X between 20 and 95)
        const leftColumnList = content.items.filter(item => {
          if (!item || typeof item.str !== 'string') return false;
          const itemX = item.transform ? item.transform[4] : 0;
          return itemX >= 20 && itemX < 95;
        });

        for (let item of leftColumnList) {
          const rawStr = item.str.trim();
          if (!rawStr) continue;
          
          if (/PAGE|MARK|TOTAL|SUBJECT/i.test(rawStr)) continue;

          // Smart Fallback: Save Question 1's location just in case the target Q goes missing
          if (new RegExp('^1(?!\\d)', 'i').test(rawStr)) {
            if(fallbackPage === 2) fallbackPage = i; 
          }

          // STRICT BOUNDARY MATCH: Prevents Q "1" from matching Q "10"
          const exactTargetRegex = new RegExp('^0?' + targetQ + '(?!\\d)', 'i');
          
          if (exactTargetRegex.test(rawStr)) {
            matchedPage = i;
            foundMatch = true;
            break;
          }
        }
      }

      // Execute Fallback if Exact Match Failed
      if (!foundMatch) {
         matchedPage = fallbackPage <= currentPdf.numPages ? fallbackPage : 1;
         document.getElementById('match-status').innerText = `Target Q Not Found - Defaulted to Pg ${matchedPage}`;
      } else {
         document.getElementById('match-status').innerText = `Focused Page ${matchedPage}`;
      }

      scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageNum = parseInt(entry.target.dataset.page);
            executeLazyRender(pageNum);
            updateActiveNavHighlight(pageNum);
          }
        });
      }, { root: track, threshold: 0.1, rootMargin: "50px 0px" });

      for (let i = 1; i <= currentPdf.numPages; i++) {
        const navBtn = document.createElement('button');
        navBtn.className = 'nav-jump-btn' + (i === matchedPage ? ' active' : '');
        navBtn.id = `nav-btn-${i}`;
        navBtn.innerText = `Pg ${i}`;
        navBtn.onclick = () => jumpToSection(i);
        navBar.appendChild(navBtn);

        const section = document.createElement('div');
        section.id = `page-sec-${i}`;
        section.className = 'page-section';
        section.dataset.page = i;
        section.innerHTML = `<div class="page-badge">PAGE ${i}</div><span class="loading-placeholder" id="loader-txt-${i}">Scroll to View</span>`;
        
        track.appendChild(section);
        scrollObserver.observe(section);
      }

      updateProg(100, "Sync Complete.");
      
      setTimeout(() => {
        overlay.style.display = 'none';
        jumpToSection(matchedPage);
      }, 150);

    } catch (err) {
      document.getElementById('match-status').innerText = "Analysis Failed";
      overlay.style.display = 'none';
    }
  }

  async function executeLazyRender(pageNum) {
    if (!currentPdf) return;
    try {
      const section = document.getElementById(`page-sec-${pageNum}`);
      if (!section || section.querySelector('canvas')) return;

      const page = await currentPdf.getPage(pageNum);
      const renderScale = window.devicePixelRatio || 2.0;
      const viewport = page.getViewport({ scale: renderScale });
      
      const pageCanvas = document.createElement('canvas');
      const ctx = pageCanvas.getContext('2d');
      
      pageCanvas.height = viewport.height;
      pageCanvas.width = viewport.width;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      
      const placeholder = document.getElementById(`loader-txt-${pageNum}`);
      if (placeholder) placeholder.remove();
      section.appendChild(pageCanvas);
    } catch (e) {
      console.error(`Dynamic viewport error on page ${pageNum}:`, e);
    }
  }

  function jumpToSection(pageIndex) {
    const targetSection = document.getElementById(`page-sec-${pageIndex}`);
    if (targetSection) {
      targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      updateActiveNavHighlight(pageIndex);
    }
  }

  function updateActiveNavHighlight(pageIndex) {
    document.querySelectorAll('.nav-jump-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.getElementById(`nav-btn-${pageIndex}`);
    if(activeBtn) {
      activeBtn.classList.add('active');
      activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  function updateProg(pct, msg) {
    prog.style.width = pct + "%";
    document.getElementById('status-txt').innerText = msg;
  }
</script>
